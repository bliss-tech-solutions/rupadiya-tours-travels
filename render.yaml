services:
  - type: web
    name: rupadiya-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rupadiya
      - key: AUTH_ACCESS_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: "*"
      - key: HOLD_DURATION_SECONDS
        value: "600"
      - key: TCS_RATE
        value: "0.01"
      - key: GST_RATE
        value: "0.05"

